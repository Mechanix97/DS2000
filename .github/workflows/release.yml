name: Release

on:
  # A version tag builds the installer and attaches it to a draft release.
  push:
    tags: ['v*']
  # A pull request that touches the pipeline builds the installer too, as a workflow artifact and
  # with no release, so a broken release build is caught before the next tag rather than on it.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json

# Creating the release and uploading the MSI to it.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The CLI that bundles the MSI. Pinned so a release does not change with whatever 2.x is newest
  # on the day of the tag; bump it deliberately.
  TAURI_CLI_VERSION: 2.11.4

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # The updater (#30) only installs an MSI signed with the key whose public half is in
      # tauri.conf.json, so with `createUpdaterArtifacts` the build signs the MSI and fails without
      # the private key. Checked up front for a clear message instead of a bundler error. Only a tag
      # signs: pull requests from forks get no secrets, and a pull request build must not come out
      # as an MSI installed copies would accept.
      - name: Check the update-signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set (see the README, Releasing)"
            exit 1
          fi

      # rust-toolchain.toml at the repository root is the single source of the toolchain, as in ci.yml.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Cargo.toml is the single source of the version (#19): a tag that disagrees with it would
      # publish an installer that reports a different version than its release.
      - name: Read the version
        id: version
        working-directory: src-tauri
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "DS2000") | .version')
          protocol=$(sed -n 's/^pub const PROTOCOL_VERSION: u8 = \([0-9]*\);/\1/p' \
            src/backend/serial/serial_message.rs)
          if [ -z "$version" ] || [ -z "$protocol" ]; then
            echo "::error::Could not read the version ($version) or the protocol ($protocol)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "Version $version, serial protocol $protocol"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.version.outputs.version }} in src-tauri/Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json

      # `cargo tauri build` runs the frontend build itself (beforeBuildCommand); it only needs the
      # dependencies installed.
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      # Built with stable rather than the pinned toolchain: the CLI's own MSRV moves ahead of the
      # app's (2.12 needs rustc 1.90), and which compiler builds the CLI does not affect the app.
      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      # The key is only in scope on a tag; a pull request builds the same MSI unsigned, as the
      # Makefile does without the key.
      - name: Build the installer
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$RELEASE" = true ]; then
            cargo tauri build
          else
            cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Locate the MSI
        id: msi
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi)
          if [ "$(echo "$msi" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one MSI, found: $msi"
            exit 1
          fi
          if [ "$RELEASE" = true ] && [ ! -f "$msi.sig" ]; then
            echo "::error::No update signature next to $msi"
            exit 1
          fi
          echo "path=$msi" >> "$GITHUB_OUTPUT"
          echo "Built $msi"

      # The installer is unsigned, so the checksum is what lets a user check the download is the
      # file this workflow built. Written in `sha256sum` format, with the bare file name, so
      # `sha256sum -c` works next to the downloaded MSI.
      - name: Compute the checksum
        id: checksum
        env:
          MSI: ${{ steps.msi.outputs.path }}
        run: |
          name=$(basename "$MSI")
          (cd "$(dirname "$MSI")" && sha256sum "$name" > "$name.sha256")
          hash=$(cut -d' ' -f1 "$MSI.sha256")
          echo "path=$MSI.sha256" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "SHA-256 $hash"

      # What the app's updater reads from releases/latest/download/latest.json: the version, and
      # where to download the MSI with the signature it is checked against. `latest` skips drafts,
      # so an update is offered only once the release is published. Needs the signature, so tags only.
      - name: Write the update manifest
        id: manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MSI: ${{ steps.msi.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(basename "$MSI")
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          manifest="$(dirname "$MSI")/latest.json"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$base/tag/v$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$MSI.sig")" \
            --arg url "$base/download/v$VERSION/$name" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > "$manifest"
          echo "path=$manifest" >> "$GITHUB_OUTPUT"
          cat "$manifest"

      # On a pull request the .sig and the manifest do not exist; a path matching nothing is skipped.
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            ${{ steps.msi.outputs.path }}
            ${{ steps.checksum.outputs.path }}
            ${{ steps.msi.outputs.path }}.sig
            ${{ steps.manifest.outputs.path }}
          if-no-files-found: error

      # A draft, so publishing stays a human decision. Re-running the workflow for the same tag
      # replaces the files of a draft, but never of a published release: installed copies read its
      # latest.json, and while the files were replaced one by one it would point at an MSI whose
      # signature does not match.
      - name: Attach the MSI to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          MSI: ${{ steps.msi.outputs.path }}
          CHECKSUM: ${{ steps.checksum.outputs.path }}
          MANIFEST: ${{ steps.manifest.outputs.path }}
          HASH: ${{ steps.checksum.outputs.hash }}
          PROTOCOL: ${{ steps.version.outputs.protocol }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; tag a new version instead"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$MSI" "$CHECKSUM" "$MSI.sig" "$MANIFEST" --clobber
            exit 0
          fi
          name=$(basename "$MSI")
          cat > notes.md <<EOF
          ## Compatibility

          This release speaks **serial protocol $PROTOCOL**. Pair it with a
          [DS2000-Firmware](https://github.com/Mechanix97/DS2000-Firmware/releases) release on the same
          protocol; the About tab shows the firmware the device reports.

          ## Installing

          Download the \`.msi\` below and run it. The installer is not signed, so Windows SmartScreen
          warns on first run: choose **More info → Run anyway**.

          ## Verifying the download

          Since the installer is unsigned, check it against its SHA-256 before running it:

          \`\`\`
          $HASH  $name
          \`\`\`

          In PowerShell, \`Get-FileHash $name\` prints the same hash (in upper case). The
          \`$name.sha256\` file below holds it too, for \`sha256sum -c $name.sha256\`.

          ## Updating

          From this version on, **About → Check for updates** installs newer releases in place.
          \`latest.json\` and \`$name.sig\` below are what it reads; you do not need them.
          EOF
          gh release create "$GITHUB_REF_NAME" "$MSI" "$CHECKSUM" "$MSI.sig" "$MANIFEST" --draft --verify-tag \
            --title "DS2000 $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
