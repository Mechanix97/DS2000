name: CI

on:
  # No base-branch filter: feature branches stack on each other in this repo, so a PR is not
  # always targeting main. Filtering by base would silently skip CI on those.
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI output small; the app logs through `tracing` at runtime anyway.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    # Windows is the supported platform, so the full suite runs here. Linux portability is
    # covered separately by the `linux` job below.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The frontend must be built first: tauri.conf.json points `frontendDist` at
      # frontend/dist, which is a build artifact and is not committed. Without this step the
      # root DS2000 crate fails to build.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src-tauri/frontend
        run: npm run build

      - name: Test frontend
        working-directory: src-tauri/frontend
        run: npm test

      # No toolchain pinned here on purpose: src-tauri/rust-toolchain.toml is the single source
      # of truth, and rustup installs from it on the first cargo invocation. Pinning a version in
      # this file too would let CI and local builds drift apart, which is exactly the failure
      # mode this replaces.
      - name: Install the pinned toolchain
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # --workspace matters: without it cargo only selects the root DS2000 package and the
      # member crates are compiled as dependencies, so their lints are not enforced.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Tests that need a running Discord client or a physical DS-2000 device are marked
      # #[ignore]. Run them locally with `cargo test -- --ignored`.
      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  linux:
    name: linux portability
    runs-on: ubuntu-latest

    # Only the platform-independent crates. The root DS2000 crate is a Tauri app and would need
    # webkit2gtk and the rest of the Linux desktop toolchain, which is not worth installing while
    # Linux is unsupported. This job exists to keep the backend from silently regrowing
    # Windows-only code: the discord crate used to fail here because its pipe reader was written
    # against named pipes with no cfg gate.
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - name: Check the platform-independent crates
        working-directory: src-tauri
        run: cargo check -p discord -p serial -p config -p common --all-targets
