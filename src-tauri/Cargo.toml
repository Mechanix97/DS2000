[workspace]
members = [
    "src/backend/discord",
    "src/backend/serial",
    "src/controller",
    "src/config",
    "src/common",
]
resolver = "2"

[package]
version = "0.1.1"
edition = "2024"
name = "DS2000"
build = "build.rs"
homepage = "https://www.mechardo3d.xyz/"
authors = ["Mechardo Labs"]

[dependencies]
tauri = { version = "2.7", features = ["tray-icon"] }
controller = { path = "src/controller" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tauri-plugin-shell = "2.0"

# Not referenced directly by main.rs, but `tauri::generate_context!()` expands to code that
# resolves `serde_json` in this crate's scope. Removing it breaks the build.
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

tauri-plugin-autostart.workspace = true
# Two instances cannot share the serial port or the Discord pipe, so the second has to hand over
# to the first rather than compete with it.
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater.workspace = true

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }
dotenvy = "0.15"

[workspace.dependencies]
discord = { path = "src/backend/discord" }
serial = { path = "src/backend/serial" }
controller = { path = "src/controller" }
config = { path = "src/config" }
common = { path = "src/common" }

tauri = { version = "2.7", features = [] }
tauri-plugin-shell = "2.0"
# Registers the executable to launch at login. Doing it by hand means writing to the Run key in
# the registry on Windows and a different mechanism per platform; the official plugin is the
# smaller commitment.
tauri-plugin-autostart = "2.5.1"
# In-app updates (#30): downloads the MSI named in the release's latest.json, checks it against the
# update-signing public key in tauri.conf.json, and runs it. Hand-rolled, this is an HTTP client, a
# minisign verifier and the msiexec hand-off, and getting the verification wrong is a remote code
# execution hole.
tauri-plugin-updater = "2"

rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls rather than the default native-tls: it drops the OpenSSL system dependency, which
# otherwise has to be installed by hand before the project builds on Linux. `blocking` was
# enabled but never used.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
directories = "6.0"
# Reads the OS display language, so a first run can follow it instead of guessing. One function,
# and the alternative is a different platform API per target.
sys-locale = "0.3"

# Only the Windows backend is enabled: Windows is the supported platform, and the other backends
# pull in platform toolchains we do not build against. Revisit when Linux/macOS become targets.
keyring = { version = "3", features = ["windows-native"] }
bytes = { version = "1.6.0" }
tracing = "0.1"

tokio = { version = "1.0", features = ["full"] }
serial2-tokio = "0.1"
# Port enumeration only: serial2 lists port names but not the USB vendor behind them, and discovery
# must know it before opening anything (opening a port resets an Arduino, writing to it reaches a
# printer or a modem). The I/O itself stays on serial2-tokio. libudev is off: Linux is not a target.
serialport = { version = "4.10", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
thiserror = "2.0"
spawned-concurrency = "0.2.2"
spawned-rt = "0.2.2"
