[package]
name = "discord"
version = "0.1.0"
edition = "2024"

[dependencies]
common.workspace = true

tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
rand.workspace = true
spawned-concurrency.workspace = true

[dev-dependencies]
# The hardware and Discord tests are diagnostic by nature: without a subscriber installed,
# RUST_LOG produces nothing and a stuck connection gives no clue why.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lib]
path = "./mod.rs"
